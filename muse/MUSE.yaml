
field_separator: "\t" 
seq_separator: " " 
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp

load_col:
    inter: [user_id, item_id, rating, timestamp]

NEG_PREFIX: neg_ 
LABEL_FIELD: label 
ITEM_LIST_LENGTH_FIELD: item_length 
LIST_SUFFIX: _list 
MAX_ITEM_LIST_LENGTH: 50 
POSITION_FIELD: position_id 

min_user_inter_num: 5
min_item_inter_num: 5

# training settings
epochs: 50 
train_batch_size: 512 
learner: adam 
learning_rate: 0.001 
training_neg_sample_num: 0 
eval_step: 1 
stopping_step: 10 
# evalution settings
eval_setting: TO_LS,full 
metrics: ["Recall", "NDCG"] 
valid_metric: NDCG@20 

eval_batch_size: 512 
weight_decay: 0
topk: [5, 10, 20]

# directory setting
log_root: "./log/"
data_path: "./dataset/"

lmd: 0.1
lmd_sem: 0.1

tau: 1

contrast: 'us_x'

sim: 'dot'

hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5